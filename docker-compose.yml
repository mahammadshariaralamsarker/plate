services:
  postgres:
    image: postgres:16-alpine
    container_name: plate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: plateDB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plate-network
    ports:
    - '5432:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: shariaralam/plate-server:latest
    build: .
    container_name: plate-app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - plate-network
    command: >
      sh -c " node dist/src/main.js "

volumes:
  postgres_data:


networks:
  plate-network:
    driver: bridge